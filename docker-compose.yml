# Bot Harbor — self-hosted stack for the Cortex NAS (UGREEN DXP4800 Plus).
#
# Three containers:
#   postgres   the database that replaced Azure SQL
#   tailscale  joins the tailnet and terminates TLS in front of the app
#   botharbor  the Blazor dashboard, sharing the tailscale network namespace
#
# Nothing publishes a host port. The only way in is the tailnet, so the dashboard is never
# exposed to the internet and needs no router port forward, and Postgres stays off the NAS's
# own already-occupied 5432.
#
#   docker compose up -d
#
# Only POSTGRES_PASSWORD uses a ${VAR:?} guard. Compose interpolates the whole file before it
# filters down to the services you named, so a guard on one service aborts `up` for every
# other one too -- bringing up postgres alone for local dev would die on TS_AUTHKEY.
# The rest are ${VAR:-}: the tailscale container reports a bad auth key itself, and the app
# logs a warning at startup naming any droplet settings it is missing.
#
# See deploy/README.md for first-run setup.

name: botharbor

services:
  postgres:
    image: postgres:16-alpine
    container_name: botharbor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botharbor}
      POSTGRES_USER: ${POSTGRES_USER:-botharbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      # Keeps index collation stable so a future pg_upgrade does not need a reindex.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port. UGOS runs its own PostgreSQL 15 on 127.0.0.1:5432, so publishing
    # here fails with "address already in use" on the NAS. The app reaches `postgres:5432`
    # over the compose network. For local development, add docker-compose.dev.yml, which
    # publishes it on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botharbor} -d ${POSTGRES_DB:-botharbor}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tailscale:
    image: tailscale/tailscale:latest
    container_name: botharbor-tailscale
    restart: unless-stopped
    # Becomes bot-harbor.<your-tailnet>.ts.net on the tailnet.
    hostname: ${TS_HOSTNAME:-bot-harbor}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      # Declarative `tailscale serve`: HTTPS on 443 with a real Let's Encrypt cert,
      # proxied to Kestrel on loopback.
      TS_SERVE_CONFIG: /config/serve.json
      # Leave Docker's embedded resolver in place. With MagicDNS taking over /etc/resolv.conf in
      # this namespace, botharbor could no longer resolve the `postgres` service name.
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Uncomment to also reach the dashboard over plain HTTP on the LAN at http://<nas-ip>:8080.
    # The tailnet hostname is the better route: it gets a valid TLS certificate.
    # ports:
    #   - "8080:8080"

  botharbor:
    image: ${BOTHARBOR_IMAGE:-kalebg08/botharbor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botharbor-app
    restart: unless-stopped
    # Share the tailscale container's network namespace so `tailscale serve` can proxy to
    # 127.0.0.1:8080, and so the app itself has no reachable address off the tailnet.
    network_mode: service:tailscale
    depends_on:
      postgres:
        condition: service_healthy
      tailscale:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-botharbor};Username=${POSTGRES_USER:-botharbor};Password=${POSTGRES_PASSWORD};Include Error Detail=true
      # tailscale serve speaks HTTP to Kestrel, so trust X-Forwarded-* and skip HTTPS redirects.
      BotHarbor__BehindReverseProxy: "true"
      BotHarbor__DataProtectionKeyPath: /var/botharbor/keys
      # Creates the first operator account on an empty database. Clear the password once you
      # have logged in and changed it.
      BotHarbor__BootstrapUser__Email: ${BOTHARBOR_ADMIN_EMAIL:-}
      BotHarbor__BootstrapUser__Password: ${BOTHARBOR_ADMIN_PASSWORD:-}
      Database__MigrateOnStartup: "true"
      ApiTokens__DigitalOcean: ${DIGITALOCEAN_TOKEN:-}
      # Cortex. Containers, images and the Stats page all read from here over SSH. The app
      # runs on this machine, so it is SSHing back to its own host -- see NasCredentials for
      # why that beats mounting the docker socket.
      Nas__Host: ${NAS_HOST:-}
      Nas__Username: ${NAS_USERNAME:-}
      Nas__Password: ${NAS_PASSWORD:-}
      # The droplet's tailnet address. Reached directly from this container, which shares the
      # tailscale sidecar's namespace, so the health panel tests the real path rather than
      # asking the droplet to check itself.
      Ollama__Host: ${OLLAMA_HOST:-}
      Ollama__Port: ${OLLAMA_PORT:-11434}
      SSH__Id: ${DROPLET_ID:-}
      SSH__Host: ${DROPLET_HOST:-}
      SSH__Username: ${DROPLET_USERNAME:-}
      SSH__Password: ${DROPLET_PASSWORD:-}
    volumes:
      - dataprotection-keys:/var/botharbor/keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Cloudflare Tunnel. Reaches the dashboard from any browser, with no client software,
  # which is what the tailnet cannot do. It shares the tailscale sidecar's network namespace
  # so that 127.0.0.1:8080 is the app -- the same loopback `tailscale serve` proxies to.
  # Both routes work at once; neither depends on the other.
  #
  # Cloudflare Access sits in front of botharbor.horizonstack.app and authenticates at the
  # edge, so unauthenticated requests never reach Cortex. That matters more than it sounds:
  # Login.razor signs in with lockoutOnFailure:false, so the app itself will let a password
  # be guessed indefinitely.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: botharbor-cloudflared
    profiles: [cloudflare]
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale: { condition: service_started }
      botharbor: { condition: service_started }
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required, see .env.example}

volumes:
  postgres-data:
  tailscale-state:
  dataprotection-keys:
