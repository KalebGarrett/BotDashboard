# Discord bots, self-hosted on the Cortex NAS.
#
#   cd /volume1/appdata/bots && sudo docker compose up -d
#
# All secrets are compiled into these images (the Secrets/*.cs classes are gitignored but are
# copied in by `COPY . ./`), so none of the four simple bots need configuration here. They need
# nothing but outbound internet.
#
# Jam Junction and its tailnet sidecar are held behind the `audio` profile and do NOT start by
# default. See deploy/bots/README.md.

name: bots

x-bot: &bot
  restart: unless-stopped
  # A Discord bot is a long-lived outbound websocket. No ports, no volumes, no inbound anything.
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  jokebot:
    <<: *bot
    image: kalebg08/jokebot:latest
    container_name: jokebot

  triviabot:
    <<: *bot
    image: kalebg08/triviabot:latest
    container_name: triviabot

  factbot:
    <<: *bot
    image: kalebg08/factbot:latest
    container_name: factbot

  prembot:
    <<: *bot
    image: kalebg08/prembot:latest
    container_name: prembot

  # ---------------------------------------------------------------------------------------
  # Below here: not started by default. `--profile audio` opts in.
  # ---------------------------------------------------------------------------------------

  # Joins the tailnet so Jam Junction can reach Lavalink and Ollama on the home server PC.
  # Both are private services with no authentication of their own, which is
  # exactly why they must not be reached over the public internet.
  bots-tailscale:
    image: tailscale/tailscale:latest
    container_name: bots-tailscale
    profiles: [audio]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-nas-bots}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      # Unlike the Bot Harbor stack, MagicDNS is wanted here: Jam Junction addresses Lavalink
      # and Ollama by tailnet IP, and nothing in this stack resolves another service by name.
      TS_ACCEPT_DNS: "true"
    volumes:
      - bots-tailscale-state:/var/lib/tailscale
    devices: [/dev/net/tun]
    cap_add: [NET_ADMIN, SYS_MODULE]

  jamjunction:
    <<: *bot
    image: kalebg08/jamjunction:latest
    container_name: jamjunction
    profiles: [audio]
    network_mode: service:bots-tailscale
    depends_on:
      bots-tailscale: { condition: service_started }
    environment:
      # Lavalink on the home server PC, over Tailscale. Overridable since the LavalinkSecrets
      # change; before that this was a compile-time const needing a rebuild to move.
      LAVALINK_HOST: ${LAVALINK_HOST:-100.121.114.24}
      LAVALINK_PORT: ${LAVALINK_PORT:-2333}
      # Ollama, also on the home server PC. 1b was chosen for the old 4 GB droplet; the PC has
      # room for the 3B default (OLLAMA_MODEL=llama3.2) once that model is pulled there.
      OLLAMA_HOST: ${OLLAMA_HOST:-100.121.114.24}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      # The proxy exists only to give YouTube a residential egress IP. Cortex is already on
      # the home connection, so requests go out from the same address without it.
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_ADDRESS: ${PROXY_ADDRESS:-}

volumes:
  bots-tailscale-state:
